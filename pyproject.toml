[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sixoh-log-doctor"
version = "0.0.1"
description = "Read-only datalog analyzer for the Ford 6.0L Powerstroke. Never writes to a vehicle."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
